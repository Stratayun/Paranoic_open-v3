# Manual phone APK build; includes Rust Core, PDF worker and pinned PDFium.
name: Phone APK (manual)
run-name: Phone APK · ${{ github.ref_name }} · ${{ github.sha }}
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
permissions:
  contents: read
concurrency:
  group: phone-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK_VERSION"
      - name: Rust Android toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
      - name: Project signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 is missing: this APK gets a one-off key and will not install over the phone's copy."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/paranoic.p12"
          echo "PARANOIC_KEYSTORE=$RUNNER_TEMP/paranoic.p12" >> "$GITHUB_ENV"
      - name: Build complete phone APK (arm64, PDFium enabled)
        working-directory: ui
        env:
          PARANOIC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace -Pparanoic.androidAbis=arm64-v8a -Pparanoic.pdfium=fetch :composeApp:assembleDebug
      - name: Verify complete native payload
        run: python3 tools/validation/android_apk.py ui/composeApp/build/outputs/apk/debug/composeApp-debug.apk --abis arm64-v8a --profile pdf --packaging extracted
      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/paranoic.p12"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Paranoic-phone-arm64-${{ github.sha }}
          path: ui/composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: APK summary
        run: |
          echo "Phone APK (arm64-v8a), signed with the project key when the secret is set; Rust Core, PDF worker and PDFium included." >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK ZIP from the Artifacts section below." >> "$GITHUB_STEP_SUMMARY"
