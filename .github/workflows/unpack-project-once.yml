name: Unpack existing project archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-project-once.yml'

permissions:
  contents: write

concurrency:
  group: unpack-project-once
  cancel-in-progress: false

jobs:
  unpack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Validate and extract source files without executing them
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, stat, zipfile, subprocess
          archive = pathlib.Path("Paranoic_v2.1-main (1).zip")
          root = pathlib.Path.cwd()
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if len(infos) > 30000 or sum(i.file_size for i in infos) > 1024**3:
                  raise SystemExit("Archive exceeds extraction limits")
              entries = []
              for i in infos:
                  p = pathlib.PurePosixPath(i.filename)
                  mode = i.external_attr >> 16
                  if (not p.parts or p.is_absolute() or '\\' in i.filename
                      or any(x.lower() == '.git' or x == '..' or ':' in x for x in p.parts)
                      or stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR)):
                      raise SystemExit(f"Unsafe archive entry: {i.filename!r}")
                  if not i.is_dir():
                      entries.append((i, p, mode))
              if not entries:
                  raise SystemExit("No source files found")
              tops = {p.parts[0] for _,p,_ in entries}
              strip = len(tops) == 1 and all(len(p.parts) > 1 for _,p,_ in entries)
              planned = []
              seen = set()
              for i,p,mode in entries:
                  rel = pathlib.Path(*p.parts[int(strip):])
                  if rel in seen or (root/rel).exists() or any(parent.is_symlink() for parent in (root/rel).parents):
                      raise SystemExit(f"Duplicate or existing path: {rel}")
                  seen.add(rel)
                  planned.append((i,rel,mode))
              for i,rel,mode in planned:
                  dest = root/rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(i) as src, dest.open('xb') as dst:
                      import shutil
                      shutil.copyfileobj(src,dst)
                  dest.chmod(0o755 if mode & 0o111 else 0o644)
              for start in range(0,len(planned),100):
                  subprocess.run(['git','add','--force','--',*[str(rel) for _,rel,_ in planned[start:start+100]]], check=True)
              print(f"Extracted and staged {len(planned)} files; original ZIP retained.")
          PY
      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m "Import existing Paranoic project from ZIP"
          git push origin HEAD:main
