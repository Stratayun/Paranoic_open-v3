# Manual verification only (owner decision 2026-11-12): no push/PR triggers.
# Covers what the Linux work container cannot: Windows compilation of the
# cfg(windows) Rust code, and the Kotlin/Compose build (desktop + Android).
name: verify (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "windows-rust, kotlin or all"
        type: choice
        options: [all, windows-rust, kotlin]
        default: all
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-rust:
    if: inputs.target == 'all' || inputs.target == 'windows-rust'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.89 (MSRV)
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - name: Check all crates and targets
        run: cargo +1.89.0 check --locked --workspace --all-targets
      - name: Clippy
        run: cargo +1.89.0 clippy --locked --workspace --all-targets
      - name: PDF worker (Windows build)
        run: cargo +1.89.0 build --locked -p paranoic-documents --features pdf --bin paranoic-pdf-worker
      - name: Windows platform tests (ACL, FileId, no-replace, confinement, private directory, local writes)
        run: cargo +1.89.0 test --locked -p paranoic-windows -p paranoic-local -p paranoic-crypto -- --test-threads=1

  kotlin:
    if: inputs.target == 'all' || inputs.target == 'kotlin'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Rust 1.89 (MSRV)
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete 'tools' package, which fails
          # with cmdline-tools 16 on current runners (run 43316152022).
          packages: platform-tools
      - name: Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile desktop and Android Kotlin, run common/desktop unit tests
        working-directory: ui
        run: >-
          ./gradlew --no-daemon --stacktrace
          :composeApp:compileKotlinDesktop :composeApp:compileDebugKotlinAndroid
          :composeApp:desktopTest :composeApp:testDebugUnitTest
          :composeApp:compileDebugAndroidTestKotlinAndroid
      - name: Kotlin test reports and generated bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-reports
          path: |
            ui/composeApp/build/reports/tests
            ui/composeApp/build/test-results
            ui/composeApp/build/generated/uniffi
          if-no-files-found: warn
