name: Windows app (exe/msi)

# Explicit builds only; the distributions workflow requests the portable bundle.
on:
  workflow_dispatch:
    inputs:
      portable_only:
        description: Skip the MSI and separate console bundle
        type: boolean
        default: false
  workflow_call:
    inputs:
      portable_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - uses: gradle/actions/setup-gradle@v4
      - name: Portable app
        working-directory: ui
        shell: pwsh
        run: ./gradlew.bat --no-daemon :composeApp:createDistributable
      - name: MSI
        if: ${{ !inputs.portable_only }}
        working-directory: ui
        shell: pwsh
        run: ./gradlew.bat --no-daemon :composeApp:packageMsi
      - name: Console variant (prints startup errors)
        if: ${{ !inputs.portable_only }}
        working-directory: ui
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon "-Pparanoic.winConsole" :composeApp:createDistributable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ../tools/build/windows_launcher.ps1 -Executable composeApp/build/compose/binaries/main/app/Paranoic/Paranoic.exe
          $bat = "@echo off`r`ncd /d `"%~dp0`"`r`necho Paranoic: start, log goes to startup-log.txt`r`nParanoic.exe > startup-log.txt 2>&1`r`necho Exit code %ERRORLEVEL% >> startup-log.txt`r`nstart notepad startup-log.txt`r`n"
          Set-Content -Path composeApp/build/compose/binaries/main/app/Paranoic/Zapusk-s-logom.bat -Value $bat -NoNewline -Encoding ascii
          Compress-Archive -Path composeApp/build/compose/binaries/main/app/Paranoic -DestinationPath ../Paranoic-windows-console.zip
          ./gradlew.bat --no-daemon :composeApp:createDistributable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The Compose MSI wraps an unpatched launcher, which fails under a non-ASCII user path.
      # Rebuild the MSI from a copy of the app image whose launcher has the UTF-8 manifest.
      - name: MSI with the UTF-8 launcher
        if: ${{ !inputs.portable_only }}
        shell: pwsh
        run: |
          $image = Join-Path $env:RUNNER_TEMP 'msi-image'
          Remove-Item -Recurse -Force $image -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $image | Out-Null
          Copy-Item -Recurse ui/composeApp/build/compose/binaries/main/app/Paranoic (Join-Path $image 'Paranoic')
          ./tools/build/windows_launcher.ps1 -Executable (Join-Path $image 'Paranoic/Paranoic.exe')
          $candle = Get-ChildItem -Recurse -Filter candle.exe -Path ui -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          $out = Join-Path $env:RUNNER_TEMP 'msi-utf8'
          & "$env:JAVA_HOME/bin/jpackage.exe" --type msi --app-image (Join-Path $image 'Paranoic') --name Paranoic `
            --app-version 2.1.0 --vendor stratayun --win-menu --win-shortcut --win-dir-chooser `
            --win-upgrade-uuid 6c1f6f3e-2b8e-4f7a-9d55-3a0e2f6b9c41 --dest $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item ui/composeApp/build/compose/binaries/main/msi/*.msi
          Copy-Item (Join-Path $out '*.msi') ui/composeApp/build/compose/binaries/main/msi/
      - name: Enable Unicode paths and add the portable diagnostic launcher
        shell: pwsh
        run: ./tools/build/windows_launcher.ps1 -Executable ui/composeApp/build/compose/binaries/main/app/Paranoic/Paranoic.exe -Diagnostics
      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path ui/composeApp/build/compose/binaries/main/app/Paranoic -DestinationPath Paranoic-windows-portable.zip
      # Preserve the bundle even if a later runtime check fails, for diagnosis.
      - uses: actions/upload-artifact@v4
        with:
          name: Paranoic-windows-portable
          path: Paranoic-windows-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Verify portable startup and Unicode paths
        shell: pwsh
        run: |
          ./tools/validation/windows_portable.ps1 -Archive Paranoic-windows-portable.zip
          ./tools/validation/windows_portable.ps1 -Archive Paranoic-windows-portable.zip -UnicodePaths -UnicodeTemp
          ./tools/validation/windows_portable.ps1 -Archive Paranoic-windows-portable.zip -UnicodePaths -UnicodeTemp -LauncherName Paranoic-debug.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-startup-results
          path: startup-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.portable_only }}
        with:
          name: Paranoic-windows-console
          path: Paranoic-windows-console.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.portable_only }}
        with:
          name: Paranoic-windows-msi
          path: ui/composeApp/build/compose/binaries/main/msi/*.msi
          retention-days: 14
