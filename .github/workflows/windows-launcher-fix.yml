name: Verify Windows Unicode launcher fix
on:
  push:
    branches: [codex/windows-startup]
    paths: [.github/workflows/windows-launcher-fix.yml]
permissions:
  contents: read
  actions: read
jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: Paranoic-windows-portable
          run-id: '45704372189'
          github-token: ${{ github.token }}
          path: portable-input
      - name: Replace only the native launcher using the newer packager
        shell: pwsh
        run: |
          Expand-Archive portable-input/Paranoic-windows-portable.zip original
          $app = (Resolve-Path original/Paranoic).Path
          $main = (Get-ChildItem "$app/app/composeApp-desktop-*.jar").Name
          Move-Item "$app/app/Paranoic.cfg" "$app/launcher.cfg"
          & "$env:JAVA_HOME/bin/jpackage.exe" --type app-image --input "$app/app" --dest repaired --name Paranoic --main-jar $main --main-class io.github.stratayun.paranoic.platform.MainKt --runtime-image "$app/runtime"
          if ($LASTEXITCODE) { throw "jpackage failed: $LASTEXITCODE" }
          Copy-Item "$app/launcher.cfg" repaired/Paranoic/app/Paranoic.cfg -Force
          Compress-Archive repaired/Paranoic repaired-portable.zip
      - name: Launch from an ASCII path
        shell: pwsh
        run: ./tools/validation/windows_portable.ps1 -Archive repaired-portable.zip
      - name: Launch from a Cyrillic path with Cyrillic temp folder
        shell: pwsh
        run: ./tools/validation/windows_portable.ps1 -Archive repaired-portable.zip -UnicodePaths -UnicodeTemp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-${{ matrix.java }}-results
          path: startup-results
      - uses: actions/upload-artifact@v4
        with:
          name: Paranoic-portable-launcher-${{ matrix.java }}
          path: repaired-portable.zip
          retention-days: 7
