name: Verify Windows Unicode launcher fix
on:
  push:
    branches: [codex/windows-startup]
    paths: [.github/workflows/windows-launcher-fix.yml, tools/build/windows_launcher.ps1]
permissions:
  contents: read
  actions: read
jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Paranoic-windows-portable
          run-id: '45704372189'
          github-token: ${{ github.token }}
          path: portable-input
      - name: Enable UTF-8 in the existing native launcher
        shell: pwsh
        run: |
          Expand-Archive portable-input/Paranoic-windows-portable.zip repaired
          ./tools/build/windows_launcher.ps1 -Executable repaired/Paranoic/Paranoic.exe -Diagnostics
          Compress-Archive repaired/Paranoic repaired-portable.zip
      - name: Launch from an ASCII path
        shell: pwsh
        run: ./tools/validation/windows_portable.ps1 -Archive repaired-portable.zip
      - name: Launch from a Cyrillic path with Cyrillic temp folder
        shell: pwsh
        run: ./tools/validation/windows_portable.ps1 -Archive repaired-portable.zip -UnicodePaths -UnicodeTemp
      - name: Launch the diagnostic EXE from the Cyrillic path
        shell: pwsh
        run: ./tools/validation/windows_portable.ps1 -Archive repaired-portable.zip -UnicodePaths -UnicodeTemp -LauncherName Paranoic-debug.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utf8-launcher-results
          path: startup-results
      - uses: actions/upload-artifact@v4
        with:
          name: Paranoic-windows-portable-fixed
          path: repaired-portable.zip
          retention-days: 7
