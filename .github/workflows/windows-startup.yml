name: Windows portable startup
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Windows packaging run containing the portable ZIP
        default: '45704372189'
        required: true
  push:
    branches: [codex/windows-startup]
    paths:
      - .github/workflows/windows-startup.yml
      - tools/validation/windows_portable.ps1
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Paranoic-windows-portable
          run-id: ${{ inputs.artifact_run || '45704372189' }}
          github-token: ${{ github.token }}
          path: portable-input
      - name: Launch the actual portable application
        shell: pwsh
        run: ./tools/validation/windows_portable.ps1 -Archive portable-input/Paranoic-windows-portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-startup-results
          path: startup-results
          retention-days: 7
