[package]
name = "paranoic-documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pdfium-render = { version = "=0.9.5", optional = true, default-features = false, features = ["pdfium_8125"] }
paranoic-core = { path = "../paranoic-core" }
paranoic-crypto = { path = "../paranoic-crypto" }
zip = { version = "=9.0.5", default-features = false, features = ["deflate", "aes-crypto"] }
zeroize = "1.8"
sevenz-rust2 = { version = "=0.7.0", features = ["aes256"] }
uuid.workspace = true
blake3.workspace = true
quick-xml = "=0.41.0"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
paranoic-windows = { path = "../paranoic-windows" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
seccompiler = { version = "=0.5.0", optional = true }
rustix = { version = "0.38", features = ["process"], optional = true }
libc = { version = "0.2", optional = true }

[lints]
workspace = true

[features]
# Enables the PDFium engine (and its sandbox) for the separate worker binary only.
pdf = ["dep:pdfium-render", "dep:seccompiler", "dep:rustix", "dep:libc"]

[[bin]]
name = "paranoic-pdf-worker"
path = "src/bin/pdf_worker.rs"
required-features = ["pdf"]

[dev-dependencies]
paranoic-local = { path = "../paranoic-local" }
crc32fast = "1.4"

